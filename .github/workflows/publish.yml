name: "Publish"

on:
  workflow_dispatch:
    inputs:
      test:
        description: 'Upload to TestPyPi'
        required: true
        default: false
        type: boolean

jobs:
  build:
    name: "Build Package"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Install python
        uses: actions/setup-python@v7.1.0

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

      - name: Sync env and build package
        run: |
          uv sync --frozen --group build --no-dev
          uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.2
        with:
          name: dist
          path: dist/

  publish:
    if: startsWith(github.ref, 'refs/tags') || (github.event_name == 'workflow_dispatch' && github.event.inputs.test == 'true')
    name: "Publish"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: build

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.2
        with:
          name: dist
          path: dist

      - name: Upload package to PyPi
        if: github.event.inputs.test == 'false'
        env:
          name: pypi
          url: https://pypi.org/p/pyds-stubs
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          attestations: true

      - name: Upload package to TestPyPi
        if: github.event.inputs.test == 'true'
        env:
          name: testpypi
          url: https://testpypi.org/p/pyds-stubs
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true
