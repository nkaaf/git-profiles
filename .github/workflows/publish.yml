name: "Publish"

on:
  workflow_dispatch:
    inputs:
      test:
        description: 'Upload to TestPyPi'
        required: true
        default: false
        type: boolean

jobs:
  build:
    name: "Build Package"
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0

      - name: Install python
        uses: actions/setup-python@v6.3.0
        with:
          check-latest: 'true'
          cache: 'pip'

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2

      - name: Build package
        run: |
          uv sync --frozen
          uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7.0.1
        with:
          name: dist
          path: dist/

  publish:
    if: startsWith(github.ref, 'refs/tags') || (github.event_name == 'workflow_dispatch' && github.event.inputs.test == 'true')
    name: "Publish"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    needs: build

    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8.0.1
        with:
          name: dist
          path: dist

      - name: Upload package to PyPi
        if: github.event.inputs.test == 'false'
        env:
          name: pypi
          url: https://pypi.org/p/pyds-stubs
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          attestations: true

      - name: Upload package to TestPyPi
        if: github.event.inputs.test == 'true'
        env:
          name: testpypi
          url: https://testpypi.org/p/pyds-stubs
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        with:
          repository-url: https://test.pypi.org/legacy/
          attestations: true
