version: 2

multi-ecosystem-groups:
  infrastructure:
    schedule:
      interval: weekly

updates:
  - package-ecosystem: devcontainers
    directory: /
    multi-ecosystem-group: infrastructure
    patterns:
      - "*"

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python-dependencies:
        patterns:
          - "*"

  - package-ecosystem: github-actions
    directory: /
    multi-ecosystem-group: infrastructure
    patterns:
      - "*"
